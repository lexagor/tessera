# Tessera local/dev stack.
#
# Caddy is the only public entry point. The broker stays on the internal network.
# This stack enables dev auth + demo broker mode for local evaluation; use the
# production overlay/runbook for real OIDC, stable secrets, and public TLS.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: tessera
      POSTGRES_PASSWORD: tessera
      POSTGRES_DB: tessera
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tessera"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data

  broker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.broker
    image: ${TESSERA_BROKER_IMAGE:-ghcr.io/lexagor/tessera-broker:0.1.3}
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 512
    mem_limit: 512m
    cpus: "1.0"
    stop_grace_period: 30s
    environment:
      BROKER_PORT: "8787"
      DATABASE_URL: postgres://tessera:tessera@postgres:5432/tessera
      REDIS_URL: redis://redis:6379
      TESSERA_DEMO_ALLOW: ${TESSERA_DEMO_ALLOW:-1}
      BROKER_SIGNING_KEY: ${BROKER_SIGNING_KEY:-0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d}
      TENANT_SECRET_ENC_KEY: ${TENANT_SECRET_ENC_KEY:-0x1111111111111111111111111111111111111111111111111111111111111111}
      TESSERA_ADMIN_TOKEN: ${TESSERA_ADMIN_TOKEN:-dev-admin-token}
      TESSERA_AUTHORITY_HMAC_SECRET: ${TESSERA_AUTHORITY_HMAC_SECRET:-tessera-dev-authority-secret-32-bytes-minimum}
      TESSERA_AUTHORITY_HMAC_SECRET_PREVIOUS: ${TESSERA_AUTHORITY_HMAC_SECRET_PREVIOUS:-}
      TESSERA_AUTHORITY_KID: ${TESSERA_AUTHORITY_KID:-v1}
      TESSERA_AUTHORITY_PREVIOUS_KID: ${TESSERA_AUTHORITY_PREVIOUS_KID:-v0}
      TESSERA_AUTHORITY_ISSUER: ${TESSERA_AUTHORITY_ISSUER:-tessera-api}
      TESSERA_AUTHORITY_AUDIENCE: ${TESSERA_AUTHORITY_AUDIENCE:-tessera-broker}
      TESSERA_AUTHORITY_REQUIRE_TOKEN: ${TESSERA_AUTHORITY_REQUIRE_TOKEN:-0}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    image: ${TESSERA_API_IMAGE:-ghcr.io/lexagor/tessera-api:0.1.3}
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 512
    mem_limit: 512m
    cpus: "1.0"
    stop_grace_period: 30s
    environment:
      NODE_ENV: development
      API_PORT: "8788"
      DATABASE_URL: postgres://tessera:tessera@postgres:5432/tessera
      BROKER_URL: http://broker:8787
      REDIS_URL: redis://redis:6379
      BROKER_DEMO_ALLOW: ${BROKER_DEMO_ALLOW:-1}
      BROKER_ADMIN_KEY: ${BROKER_ADMIN_KEY:-}
      BROKER_ADMIN_TOKEN: ${BROKER_ADMIN_TOKEN:-dev-admin-token}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      VERIFY_BASE_URL: ${VERIFY_BASE_URL:-http://localhost:8080}
      TRUST_PROXY: "1"
      AUTH_DEV_MODE: ${AUTH_DEV_MODE:-1}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_ALLOWED_DOMAINS: ${OIDC_ALLOWED_DOMAINS:-}
      OIDC_ALLOW_EMAIL_LINKING: ${OIDC_ALLOW_EMAIL_LINKING:-0}
      OIDC_LOGOUT_URL: ${OIDC_LOGOUT_URL:-}
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:-}
      OIDC_STATE_SECRET: ${OIDC_STATE_SECRET:-tessera-dev-oidc-state-secret-32-bytes-minimum}
      CONTROL_PLANE_ENC_KEY: ${CONTROL_PLANE_ENC_KEY:-0x2222222222222222222222222222222222222222222222222222222222222222}
      CONTROL_PLANE_RLS: ${CONTROL_PLANE_RLS:-0}
      TESSERA_AUTHORITY_HMAC_SECRET: ${TESSERA_AUTHORITY_HMAC_SECRET:-tessera-dev-authority-secret-32-bytes-minimum}
      TESSERA_AUTHORITY_HMAC_SECRET_PREVIOUS: ${TESSERA_AUTHORITY_HMAC_SECRET_PREVIOUS:-}
      TESSERA_AUTHORITY_KID: ${TESSERA_AUTHORITY_KID:-v1}
      TESSERA_AUTHORITY_PREVIOUS_KID: ${TESSERA_AUTHORITY_PREVIOUS_KID:-v0}
      TESSERA_AUTHORITY_ISSUER: ${TESSERA_AUTHORITY_ISSUER:-tessera-api}
      TESSERA_AUTHORITY_AUDIENCE: ${TESSERA_AUTHORITY_AUDIENCE:-tessera-broker}
      TESSERA_AUTHORITY_TOKEN_TTL_SECONDS: ${TESSERA_AUTHORITY_TOKEN_TTL_SECONDS:-300}
      TESSERA_AUTHORITY_MINT_PER_MINUTE: ${TESSERA_AUTHORITY_MINT_PER_MINUTE:-30}
      AGENT_RECEIPT_ED25519_KEY: ${AGENT_RECEIPT_ED25519_KEY:-}
      AGENT_RECEIPT_ISSUER_DID: ${AGENT_RECEIPT_ISSUER_DID:-}
      AGENT_RECEIPT_TSA_URL: ${AGENT_RECEIPT_TSA_URL:-}
      EVIDENCE_DIR: /data/evidence
      EVIDENCE_S3_BUCKET: ${EVIDENCE_S3_BUCKET:-}
      EVIDENCE_S3_REGION: ${EVIDENCE_S3_REGION:-us-east-1}
      EVIDENCE_S3_ENDPOINT: ${EVIDENCE_S3_ENDPOINT:-}
      EVIDENCE_S3_ACCESS_KEY: ${EVIDENCE_S3_ACCESS_KEY:-}
      EVIDENCE_S3_SECRET_KEY: ${EVIDENCE_S3_SECRET_KEY:-}
      EVIDENCE_S3_PREFIX: ${EVIDENCE_S3_PREFIX:-evidence}
      EVIDENCE_S3_FORCE_PATH_STYLE: ${EVIDENCE_S3_FORCE_PATH_STYLE:-0}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-disabled}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      EMAIL_APP_URL: ${EMAIL_APP_URL:-}
      ALLOW_PRIVATE_WEBHOOKS: ${ALLOW_PRIVATE_WEBHOOKS:-1}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_TEAM: ${STRIPE_PRICE_TEAM:-}
      STRIPE_PRICE_GROWTH: ${STRIPE_PRICE_GROWTH:-}
      STRIPE_PORTAL_RETURN_URL: ${STRIPE_PORTAL_RETURN_URL:-}
    volumes:
      - evidence:/data/evidence
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8788/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_started

  portal:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.portal
    image: ${TESSERA_PORTAL_IMAGE:-ghcr.io/lexagor/tessera-portal:0.1.3}
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /config
      - /data
    pids_limit: 128
    mem_limit: 128m
    cpus: "0.5"

  verify:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.verify
    image: ${TESSERA_VERIFY_IMAGE:-ghcr.io/lexagor/tessera-verify:0.1.3}
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /config
      - /data
    pids_limit: 128
    mem_limit: 128m
    cpus: "0.5"
    depends_on:
      api:
        condition: service_started

  site:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.site
    image: ${TESSERA_SITE_IMAGE:-ghcr.io/lexagor/tessera-site:0.1.3}
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /config
      - /data
    pids_limit: 128
    mem_limit: 128m
    cpus: "0.5"
    ports:
      - "${SITE_PORT:-8081}:8080"

  caddy:
    image: caddy:2-alpine@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: "1.0"
    stop_grace_period: 30s
    ports:
      - "${CADDY_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - portal
      - verify
      - site

volumes:
  pgdata:
  evidence:
  redisdata:
