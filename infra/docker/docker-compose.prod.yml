# Production overlay: real TLS + domain + no dev defaults.
#
#   SITE_DOMAIN=thetessera.xyz APP_DOMAIN=app.thetessera.xyz VERIFY_DOMAIN=verify.thetessera.xyz \
#   ACME_EMAIL=ops@thetessera.xyz \
#   AUTH_DEV_MODE=0 TESSERA_DEMO_ALLOW=0 BROKER_DEMO_ALLOW=0 \
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Required: OIDC_* values, OIDC_STATE_SECRET, CONTROL_PLANE_ENC_KEY,
# TENANT_SECRET_ENC_KEY, BROKER_SIGNING_KEY, BROKER_ADMIN_KEY,
# BROKER_ADMIN_TOKEN, TESSERA_ADMIN_TOKEN, POSTGRES_PASSWORD,
# POSTGRES_APP_PASSWORD, DATABASE_URL, and TESSERA_AUTHORITY_HMAC_SECRET
# (at least 32 bytes).

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - ../sql:/sql:ro

  api:
    environment:
      NODE_ENV: production
      AUTH_DEV_MODE: "0"
      COOKIE_SECURE: "1"
      ALLOW_PRIVATE_WEBHOOKS: "0"
      BROKER_DEMO_ALLOW: "0"
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://app.thetessera.xyz}
      VERIFY_BASE_URL: ${VERIFY_BASE_URL:-https://verify.thetessera.xyz}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-__Host-tessera_session}
      OIDC_ISSUER: ${OIDC_ISSUER:?set OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:?set OIDC_REDIRECT_URI}
      OIDC_ALLOW_EMAIL_LINKING: ${OIDC_ALLOW_EMAIL_LINKING:-0}
      OIDC_STATE_SECRET: ${OIDC_STATE_SECRET:?set OIDC_STATE_SECRET}
      CONTROL_PLANE_ENC_KEY: ${CONTROL_PLANE_ENC_KEY:?set CONTROL_PLANE_ENC_KEY}
      BROKER_ADMIN_KEY: ${BROKER_ADMIN_KEY:?set BROKER_ADMIN_KEY}
      BROKER_ADMIN_TOKEN: ${BROKER_ADMIN_TOKEN:?set BROKER_ADMIN_TOKEN}
      TESSERA_AUTHORITY_HMAC_SECRET: ${TESSERA_AUTHORITY_HMAC_SECRET:?set TESSERA_AUTHORITY_HMAC_SECRET}
      TESSERA_AUTHORITY_HMAC_SECRET_PREVIOUS: ${TESSERA_AUTHORITY_HMAC_SECRET_PREVIOUS:-}

  broker:
    environment:
      TESSERA_PRODUCTION: "1"
      TESSERA_DEMO_ALLOW: "0"
      EGRESS_ALLOWLIST: ${EGRESS_ALLOWLIST:-}
      EGRESS_ALLOW_PRIVATE: "0"
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      BROKER_SIGNING_KEY: ${BROKER_SIGNING_KEY:?set BROKER_SIGNING_KEY}
      TENANT_SECRET_ENC_KEY: ${TENANT_SECRET_ENC_KEY:?set TENANT_SECRET_ENC_KEY}
      TESSERA_ADMIN_TOKEN: ${TESSERA_ADMIN_TOKEN:?set TESSERA_ADMIN_TOKEN}
      TESSERA_AUTHORITY_HMAC_SECRET: ${TESSERA_AUTHORITY_HMAC_SECRET:?set TESSERA_AUTHORITY_HMAC_SECRET}
      TESSERA_AUTHORITY_HMAC_SECRET_PREVIOUS: ${TESSERA_AUTHORITY_HMAC_SECRET_PREVIOUS:-}
      TESSERA_AUTHORITY_REQUIRE_TOKEN: "1"

  site:
    ports: !reset []

  caddy:
    ports: !override
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-thetessera.xyz}
      APP_DOMAIN: ${APP_DOMAIN:-app.thetessera.xyz}
      VERIFY_DOMAIN: ${VERIFY_DOMAIN:-verify.thetessera.xyz}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes: !override
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
