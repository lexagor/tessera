name: Proof link

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify public proof artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          failed=0
          check() {
            name="$1"; url="$2"
            code="$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url" || true)"
            echo "$name $url -> $code"
            [ "$code" = "200" ] || failed=1
          }
          check "static-proof" "https://thetessera.xyz/proof/live-denial.html"
          check "proof-json" "https://thetessera.xyz/proof/live-denial.json"
          check "sandbox-proof" "https://thetessera.xyz/proof/sandbox-action.html"
          check "sandbox-json" "https://thetessera.xyz/proof/sandbox-action.json"
          check "interactive-verifier" "https://verify.thetessera.xyz/verify/MF8r1-gEjpTqJkMXBftezBAfqhy6UORapo-xluIMlW4"
          check "public-api" "https://app.thetessera.xyz/v1/public/verify/MF8r1-gEjpTqJkMXBftezBAfqhy6UORapo-xluIMlW4"

          curl -fsS --max-time 20 https://thetessera.xyz/proof/live-denial.json -o /tmp/live-denial.json
          npx -y -p @tessera-verify/verify@0.1.3 tessera-verify /tmp/live-denial.json \
            --expected-signer 0xc35374b171e3be80b62c7612479f4d65e519f4e6 > /tmp/proof-result.json || failed=1
          cat /tmp/proof-result.json || true
          curl -fsS --max-time 20 https://thetessera.xyz/proof/sandbox-action.json -o /tmp/sandbox-action.json
          npx -y -p @tessera-verify/verify@0.1.3 tessera-verify /tmp/sandbox-action.json \
            --expected-signer 0x70997970c51812dc3a010c7d01b50e0d17dc79c8 > /tmp/sandbox-result.json || failed=1
          cat /tmp/sandbox-result.json || true

          title="Public proof verification failed"
          issue="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ "$failed" = "1" ]; then
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "The investor proof link or offline verification failed at $(date -u +%FT%TZ)."
            else
              gh issue create --title "$title" --body "The public proof page, API, or offline verification failed at $(date -u +%FT%TZ). Inspect the proof assets and hosted verifier."
            fi
            exit 1
          fi
          if [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Proof page, API, and offline verification passed at $(date -u +%FT%TZ)."
          fi
