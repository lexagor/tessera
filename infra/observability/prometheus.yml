# Example scrape config for a Compose network or a Prometheus sidecar.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: tessera-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8788"]
  - job_name: tessera-broker
    metrics_path: /metrics
    static_configs:
      - targets: ["broker:8787"]
  - job_name: tessera-readyz
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["https://app.thetessera.xyz/readyz"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
