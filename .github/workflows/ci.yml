name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tessera
          POSTGRES_PASSWORD: tessera
          POSTGRES_DB: tessera_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tessera"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://tessera:tessera@127.0.0.1:5432/tessera_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Build broker for SDK e2e
        run: cargo build --manifest-path apps/broker/Cargo.toml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: node scripts/check-csp-hash.mjs
      - run: pnpm test
      - name: Verify control-plane RLS policies
        env:
          DATABASE_URL: postgres://tessera:tessera@127.0.0.1:5432/tessera_test
          RLS_REQUIRE_TABLES: "1"
        run: sh infra/scripts/check-control-plane-rls.sh

  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tessera
          POSTGRES_PASSWORD: tessera
          POSTGRES_DB: tessera_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tessera"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://tessera:tessera@127.0.0.1:5432/tessera_test
      REDIS_URL: redis://127.0.0.1:6379
    defaults:
      run:
        working-directory: apps/broker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
      - name: Build ReceiptAnchor artifact
        working-directory: contracts/receipts
        run: forge build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - name: Reapply RLS policies for the verification step
        run: cargo test --test rls_postgres
      - name: Install Postgres client for RLS check
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Verify RLS policies
        env:
          DATABASE_URL: postgres://tessera:tessera@127.0.0.1:5432/tessera_test
          RLS_REQUIRE_TABLES: "1"
        run: sh ../../infra/scripts/check-rls.sh
      - run: cargo bench --no-run

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/receipts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
      - run: forge install foundry-rs/forge-std --no-commit || true
      - run: forge fmt --check
      - run: forge build
      - run: forge test -q

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install SDK
        run: python -m pip install --upgrade pip && python -m pip install -e "packages/sdk-py[dev]"
      - name: Ruff
        run: ruff check packages/sdk-py/tessera_verify packages/sdk-py/tests
      - name: Mypy
        run: mypy packages/sdk-py/tessera_verify
      - name: Pytest
        run: pytest -q packages/sdk-py/tests
