name: Proof link

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Verify public proof artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          failed=0
          check() {
            name="$1"; url="$2"
            code="$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url" || true)"
            echo "$name $url -> $code"
            [ "$code" = "200" ] || failed=1
          }
          check "static-proof" "https://thetessera.xyz/proof/live-denial.html"
          check "proof-json" "https://thetessera.xyz/proof/live-denial.json"
          check "sandbox-proof" "https://thetessera.xyz/proof/sandbox-action.html"
          check "sandbox-json" "https://thetessera.xyz/proof/sandbox-action.json"
          check "stripe-proof" "https://thetessera.xyz/proof/stripe-test-refund.html"
          check "stripe-json" "https://thetessera.xyz/proof/stripe-test-refund.json"
          check "tamper-proof" "https://thetessera.xyz/proof/tamper-test.html"
          check "tamper-json" "https://thetessera.xyz/proof/tamper-test-tampered.json"
          check "manifest" "https://thetessera.xyz/proof/manifest.json"
          check "reviewer-sample" "https://thetessera.xyz/proof/reviewer-pack-sample.html"

          curl -fsS --max-time 20 https://thetessera.xyz/proof/live-denial.json -o /tmp/live-denial.json
          npx -y -p @tessera-verify/verify@0.1.3 tessera-verify /tmp/live-denial.json \
            --expected-signer 0xc35374b171e3be80b62c7612479f4d65e519f4e6 > /tmp/proof-result.json || failed=1
          cat /tmp/proof-result.json || true
          curl -fsS --max-time 20 https://thetessera.xyz/proof/sandbox-action.json -o /tmp/sandbox-action.json
          npx -y -p @tessera-verify/verify@0.1.3 tessera-verify /tmp/sandbox-action.json \
            --expected-signer 0x70997970c51812dc3a010c7d01b50e0d17dc79c8 > /tmp/sandbox-result.json || failed=1
          cat /tmp/sandbox-result.json || true
          curl -fsS --max-time 20 https://thetessera.xyz/proof/stripe-test-refund.json -o /tmp/stripe-test-refund.json
          npx -y -p @tessera-verify/verify@0.1.3 tessera-verify /tmp/stripe-test-refund.json \
            --expected-signer 0xc35374b171e3be80b62c7612479f4d65e519f4e6 > /tmp/stripe-result.json || failed=1
          cat /tmp/stripe-result.json || true
          curl -fsS --max-time 20 https://thetessera.xyz/proof/tamper-test-tampered.json -o /tmp/tamper-test-tampered.json
          if npx -y -p @tessera-verify/verify@0.1.3 tessera-verify /tmp/tamper-test-tampered.json \
            --expected-signer 0xc35374b171e3be80b62c7612479f4d65e519f4e6 > /tmp/tamper-result.json; then
            echo "tampered record unexpectedly verified"
            cat /tmp/tamper-result.json
            failed=1
          else
            cat /tmp/tamper-result.json
            grep -q '"valid": false' /tmp/tamper-result.json || failed=1
          fi

          if ! curl -fsS --max-time 20 https://thetessera.xyz/proof/manifest.json -o /tmp/proof-manifest.json; then
            echo "manifest download failed"
            failed=1
          else
            PROOF_MANIFEST=/tmp/proof-manifest.json PROOF_BASE_URL=https://thetessera.xyz \
              node scripts/check-proof-manifest.mjs || failed=1
          fi

          title="Public proof verification failed"
          issue="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ "$failed" = "1" ]; then
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "The investor proof link or offline verification failed at $(date -u +%FT%TZ)."
            else
              gh issue create --title "$title" --body "The public proof page, API, or offline verification failed at $(date -u +%FT%TZ). Inspect the proof assets and hosted verifier."
            fi
            exit 1
          fi
          if [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Proof page, API, and offline verification passed at $(date -u +%FT%TZ)."
          fi
