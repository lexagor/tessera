# Staging overlay. Use a separate host or a short-lived larger machine; do not run this on the
# 2 GB production VPS. Invoke with an isolated project name:
#
#   docker compose -p tessera-staging \
#     -f infra/docker/docker-compose.yml \
#     -f infra/docker/docker-compose.staging.yml \
#     --env-file infra/docker/.env.staging up -d --no-build
#
# Staging must use sandbox providers and a dedicated Auth0 application. Never copy production
# signing keys, provider credentials, or customer evidence into staging.

services:
  postgres:
    environment:
      POSTGRES_DB: tessera_staging
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:?set STAGING_POSTGRES_PASSWORD}
      POSTGRES_APP_PASSWORD: ${STAGING_POSTGRES_APP_PASSWORD:?set STAGING_POSTGRES_APP_PASSWORD}
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro

  api:
    environment:
      NODE_ENV: production
      AUTH_DEV_MODE: "0"
      COOKIE_SECURE: "1"
      ALLOW_PRIVATE_WEBHOOKS: "0"
      BROKER_DEMO_ALLOW: "0"
      DATABASE_URL: ${STAGING_DATABASE_URL:?set STAGING_DATABASE_URL}
      BROKER_URL: http://broker:8787
      PUBLIC_BASE_URL: ${STAGING_PUBLIC_BASE_URL:?set STAGING_PUBLIC_BASE_URL}
      VERIFY_BASE_URL: ${STAGING_VERIFY_BASE_URL:?set STAGING_VERIFY_BASE_URL}
      OIDC_ISSUER: ${STAGING_OIDC_ISSUER:?set STAGING_OIDC_ISSUER}
      OIDC_CLIENT_ID: ${STAGING_OIDC_CLIENT_ID:?set STAGING_OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${STAGING_OIDC_CLIENT_SECRET:?set STAGING_OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: ${STAGING_OIDC_REDIRECT_URI:?set STAGING_OIDC_REDIRECT_URI}
      OIDC_LOGOUT_URL: ${STAGING_OIDC_LOGOUT_URL:-}
      OIDC_STATE_SECRET: ${STAGING_OIDC_STATE_SECRET:?set STAGING_OIDC_STATE_SECRET}
      BOOTSTRAP_EMAIL: ${STAGING_BOOTSTRAP_EMAIL:-}
      OIDC_ALLOWED_DOMAINS: ${STAGING_OIDC_ALLOWED_DOMAINS:-}
      OIDC_ALLOWED_EMAILS: ${STAGING_OIDC_ALLOWED_EMAILS:-}
      BROKER_ADMIN_KEY: ${STAGING_BROKER_ADMIN_KEY:?set STAGING_BROKER_ADMIN_KEY}
      BROKER_ADMIN_TOKEN: ${STAGING_BROKER_ADMIN_TOKEN:?set STAGING_BROKER_ADMIN_TOKEN}
      CONTROL_PLANE_ENC_KEY: ${STAGING_CONTROL_PLANE_ENC_KEY:?set STAGING_CONTROL_PLANE_ENC_KEY}
      CONTROL_PLANE_RLS: ${STAGING_CONTROL_PLANE_RLS:-0}
      TESSERA_AUTHORITY_HMAC_SECRET: ${STAGING_AUTHORITY_HMAC_SECRET:?set STAGING_AUTHORITY_HMAC_SECRET}
      EMAIL_PROVIDER: ${STAGING_EMAIL_PROVIDER:-disabled}
      EMAIL_API_KEY: ${STAGING_EMAIL_API_KEY:-}
      EMAIL_FROM: ${STAGING_EMAIL_FROM:-}
      EVIDENCE_S3_BUCKET: ${STAGING_EVIDENCE_S3_BUCKET:-}
      EVIDENCE_S3_REGION: ${STAGING_EVIDENCE_S3_REGION:-us-east-1}
      EVIDENCE_S3_ENDPOINT: ${STAGING_EVIDENCE_S3_ENDPOINT:-}
      EVIDENCE_S3_ACCESS_KEY: ${STAGING_EVIDENCE_S3_ACCESS_KEY:-}
      EVIDENCE_S3_SECRET_KEY: ${STAGING_EVIDENCE_S3_SECRET_KEY:-}
      EVIDENCE_S3_FORCE_PATH_STYLE: ${STAGING_EVIDENCE_S3_FORCE_PATH_STYLE:-0}

  broker:
    environment:
      TESSERA_PRODUCTION: "1"
      TESSERA_DEMO_ALLOW: "0"
      EGRESS_ALLOW_PRIVATE: "0"
      DATABASE_URL: ${STAGING_DATABASE_URL:?set STAGING_DATABASE_URL}
      TESSERA_ADMIN_TOKEN: ${STAGING_BROKER_ADMIN_TOKEN:?set STAGING_BROKER_ADMIN_TOKEN}
      BROKER_SIGNING_KEY: ${STAGING_BROKER_SIGNING_KEY:?set STAGING_BROKER_SIGNING_KEY}
      TENANT_SECRET_ENC_KEY: ${STAGING_TENANT_SECRET_ENC_KEY:?set STAGING_TENANT_SECRET_ENC_KEY}
      TESSERA_AUTHORITY_HMAC_SECRET: ${STAGING_AUTHORITY_HMAC_SECRET:?set STAGING_AUTHORITY_HMAC_SECRET}
      TESSERA_AUTHORITY_REQUIRE_TOKEN: "1"

  site:
    ports: !reset []
    environment: {}

  caddy:
    ports: !override
      - "${STAGING_CADDY_PORT:-8082}:80"
    environment: {}
