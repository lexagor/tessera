<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #fafafa;
        --ink: #171717;
        --muted: #666;
        --line: #e3e3e3;
        --accent: #297a3a;
        --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      * { box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; margin: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 64px 72px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
      }
      .top { display: flex; justify-content: space-between; align-items: center; }
      .brand { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 600; letter-spacing: -.03em; }
      .mark { width: 30px; height: 30px; }
      .tag { color: var(--muted); font: 600 11px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
      h1 { margin: 0; max-width: 850px; font-size: 64px; line-height: 1.02; letter-spacing: -.055em; font-weight: 450; }
      p { margin: 18px 0 0; max-width: 700px; color: var(--muted); font-size: 21px; line-height: 1.45; }
      .bottom { display: flex; align-items: flex-end; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 22px; }
      .url { color: var(--muted); font: 12px/1.4 var(--mono); }
      .proof { border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: 12px 15px; font: 11px/1.6 var(--mono); color: #444; }
      .proof b { color: var(--accent); font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="top">
      <div class="brand">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="1" y="1" width="13" height="13" rx="2" fill="#171717" />
          <rect x="18" y="1" width="13" height="13" rx="2" fill="#171717" />
          <rect x="1" y="18" width="13" height="13" rx="2" fill="#171717" />
          <rect x="18" y="18" width="13" height="13" rx="2" fill="#5ee9a0" />
        </svg>
        Tessera
      </div>
      <div class="tag">Proof of action for AI agents</div>
    </div>
    <div>
      <h1>Your enterprise buyer asked for proof. Here it is.</h1>
      <p>Signed, independently verifiable action records for AI agents.</p>
    </div>
    <div class="bottom">
      <span class="url">thetessera.xyz</span>
      <div class="proof">ACTION RECORD · V2 &nbsp; <b>ALLOW</b> &nbsp; signature verified</div>
    </div>
  </body>
</html>
